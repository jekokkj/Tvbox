name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  launcher:
    name: Launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Chave de assinatura
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.p12"
          echo "KS_FILE=$RUNNER_TEMP/ks.p12" >> "$GITHUB_ENV"
          ALIAS=$(keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/ks.p12" -storepass "$KS_PASS" | grep -i PrivateKeyEntry | head -1 | cut -d, -f1)
          echo "KS_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "alias da chave: $ALIAS"

      - name: Compilar
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tvlauncher-apk
          path: app/build/outputs/apk/release/*.apk

  vita:
    name: Vita Link
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Chave de assinatura
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.p12"
          echo "KS_FILE=$RUNNER_TEMP/ks.p12" >> "$GITHUB_ENV"
          ALIAS=$(keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/ks.p12" -storepass "$KS_PASS" | grep -i PrivateKeyEntry | head -1 | cut -d, -f1)
          echo "KS_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "alias da chave: $ALIAS"

      - name: Compilar
        working-directory: vita
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: vitalink-apk
          path: vita/app/build/outputs/apk/release/*.apk

  receptor:
    name: Receptor Spotify (Android 7+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: receptor/rust

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk --locked

      # --platform 24 = Android 7.0. O audio usa AudioTrack (JNI), nao o AAudio (API 26).
      - name: Compilar o nucleo nativo
        working-directory: receptor/rust
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t armeabi-v7a -t arm64-v8a --platform 24 \
            -o ../app/src/main/jniLibs build --release
          SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib"
          cp "$SYSROOT/arm-linux-androideabi/libc++_shared.so" ../app/src/main/jniLibs/armeabi-v7a/
          cp "$SYSROOT/aarch64-linux-android/libc++_shared.so" ../app/src/main/jniLibs/arm64-v8a/
          ls -la ../app/src/main/jniLibs/*

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Chave de assinatura
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.p12"
          echo "KS_FILE=$RUNNER_TEMP/ks.p12" >> "$GITHUB_ENV"
          ALIAS=$(keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/ks.p12" -storepass "$KS_PASS" | grep -i PrivateKeyEntry | head -1 | cut -d, -f1)
          echo "KS_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Compilar APK
        working-directory: receptor
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: receptor-apk
          path: receptor/app/build/outputs/apk/release/*.apk
